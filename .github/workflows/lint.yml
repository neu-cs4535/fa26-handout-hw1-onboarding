name: Lint

# Handout copy of the product's lint lane. `pawtograder/platform` runs eight more
# workflows on a push; they are deleted on this branch, not disabled, because
# deploy.yml triggers on pull_request_target and checks out the PR head, which on a
# repo that takes pull requests from a class is a way to run submitted code with the
# base repo's token. The rest (preview environments, image publishing, a11y and
# Playwright suites) need cluster credentials and self-hosted labels this org has no
# reason to hold.
#
# What survives is the part a submission can actually break: lint + prettier, and the
# Deno tests over supabase/functions, which is where a stale SupabaseTypes.d.ts shows
# up if you skip `npm run client-local` after writing a migration.
#
# `ripley-cloud` is the org-scoped ARC scale set for neu-cs4535 (see
# apps/arc/values-neu-cs4535.yaml in the k8s repo). It is sized for `npm ci` plus a
# static-site build; this repo's node_modules is ~4.5 GB against an 8 Gi tmpfs
# workspace, so the lint job is the one to watch if runs start dying.
permissions:
  contents: read
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
jobs:
  lint:
    runs-on: ripley-cloud
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node-22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node-22-
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Run linting check
        run: npm run lint

  # Fast, deterministic unit tests for the gradebook recalc computation (the math the
  # gradebook-calculations e2e fixtures exercise end-to-end through the async pipeline).
  # These run the real edge-function expression functions directly — no DB, no pipeline.
  deno-unit-tests:
    runs-on: ripley-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Deno unit tests
        run: npm run test:functions
